name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ZipPartMaker.exe
          - os: macos-latest
            artifact: ZipPartMaker.dmg
          - os: ubuntu-latest
            artifact: ZipPartMaker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from app.version import __version__
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert project["project"]["version"] == __version__, "Package versions differ"
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{__version__}", "Tag differs from app version"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={__version__}\n")
          PY
      - run: python -m pip install -e ".[dev]"
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m unittest tools.codeintel.test_indexer -q
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - if: runner.os == 'macOS'
        run: ./scripts/build_macos.sh
      - if: runner.os == 'Linux'
        run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZipPartMaker-v${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dist/${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Prepare release notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = changelog.split(f"## {version} - ", 1)[1]
          notes = section.partition("\n")[2].split("\n## ", 1)[0].strip()
          notes += "\n\nBản tải xuống: Windows (EXE), macOS Apple Silicon (DMG), Linux x64.\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-files/ZipPartMaker.exe
          release-files/ZipPartMaker.dmg
          release-files/ZipPartMaker
          --repo "${{ github.repository }}"
          --title "Zip Part Maker ${{ github.ref_name }}"
          --notes-file release-notes.md
