name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ZipPartMaker.exe
          - os: macos-latest
            artifact: ZipPartMaker.dmg
          - os: ubuntu-latest
            artifact: ZipPartMaker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - if: runner.os == 'macOS'
        run: ./scripts/build_macos.sh
      - if: runner.os == 'Linux'
        run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZipPartMaker-v0.0.3-${{ runner.os }}-${{ runner.arch }}
          path: dist/${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-files/ZipPartMaker.exe
          release-files/ZipPartMaker.dmg
          release-files/ZipPartMaker
          --repo "${{ github.repository }}"
          --title "Zip Part Maker ${{ github.ref_name }}"
          --generate-notes
